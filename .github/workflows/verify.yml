name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect BOFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Verify
        run: make verify

  windows:
    name: Transcript encoding
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build and run text tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /WX /DREX_TEXT_TEST /Isrc\common src\common\text.c tests\text_test.c /Fe:%RUNNER_TEMP%\rex-text-test.exe
          "%RUNNER_TEMP%\rex-text-test.exe"

